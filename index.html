<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abhishek - Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(0, 0, 33);
            color: white;
            font-family: 'Almarai', sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 80px;
            background-color: rgb(9, 9, 62);
        }

        nav ul {
            display: flex;
            justify-content: center;
        }

        nav ul li {
            margin: 0 23px;
            list-style: none;
            cursor: pointer;
        }

        nav ul li a{
            text-decoration: none;
            color: white;
        }
        nav ul li a:hover{
            font-size: 1.01rem;
            color: rgb(175, 102, 243);
        }

        .left {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .firstSection {
            display: flex;
            justify-content: space-around;
            margin: 80px 0;
            align-items: center;
        }

        .firstSection > div {
            width: 40%;
        }

        .leftSection {
            font-size: 3rem;
            margin: 70px 0;
        }

        .leftSection > div {
            margin-top: 15px;
        }

        .rightSection img {
            width: 80%;
        }

        .Purple {
            color: rgb(175, 102, 243);
        }

        #changingText {
            color: rgb(175, 102, 243);
        }

        /* Blinking cursor */
        #changingText::after {
            content: "|";
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>

            <div class="left">
                Abhishek's Portfolio
            </div>

            <div class="right">
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>

        </nav>
    </header>


    <main>

        <section class="firstSection">

            <div class="leftSection">

                Hi, My Name is
                <span class="Purple">Abhishek Singh</span>

                <div>
                    and I am a passionate
                    <span id="changingText"></span>
                </div>

            </div>


            <div class="rightSection">

                <img src="bg.png" alt="Abhishek Portfolio">

            </div>

        </section>

    </main>


    <script>

        const words = [
            "Programmer.",
            "Web Developer.",
            "AI/ML Enthusiast.",
            "Problem Solver."
        ];

        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        const changingText = document.getElementById("changingText");


        function typeEffect() {

            const currentWord = words[wordIndex];


            if (!isDeleting) {

                changingText.textContent =
                    currentWord.substring(0, charIndex + 1);

                charIndex++;


                if (charIndex === currentWord.length) {

                    isDeleting = true;

                    setTimeout(typeEffect, 1500);

                    return;
                }

            } else {

                changingText.textContent =
                    currentWord.substring(0, charIndex - 1);

                charIndex--;


                if (charIndex === 0) {

                    isDeleting = false;

                    wordIndex++;

                    if (wordIndex === words.length) {
                        wordIndex = 0;
                    }
                }
            }


            setTimeout(
                typeEffect,
                isDeleting ? 60 : 100
            );
        }


        typeEffect();

    </script>

</body>

</html>
