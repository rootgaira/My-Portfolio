<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abhishek - Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(0, 0, 33);
            color: white;
            font-family: 'Almarai', sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 80px;
            background-color: rgb(9, 9, 62);
        }

        nav ul {
            display: flex;
            justify-content: center;
        }

        nav ul li {
            margin: 0 23px;
            list-style: none;
            cursor: pointer;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
        }

        nav ul li a:hover {
            font-size: 1.01rem;
            color: rgb(175, 102, 243);
        }

        .left {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .firstSection {
            display: flex;
            justify-content: space-around;
            margin: 125px 0;
            align-items: center;
        }

        .firstSection>div {
            width: 40%;
        }

        .leftSection {
            font-size: 3rem;
            margin: 70px 0;
        }

        .leftSection>div {
            margin-top: 15px;
        }

        .rightSection img {
            width: 80%;
        }

        .Purple {
            color: rgb(175, 102, 243);
        }

        #element {
            color: rgb(164, 80, 246);
        }

        .secondSection {
            max-width: 80vw;
            margin:auto;
            background-color: rgb(9, 9, 62);
        }

        main hr{
            border:0;
            height:1px;
            background:rgb(41, 41, 91);
            margin: 40px 80px;
        }
    </style>
</head>

<body>

    <header>
        <nav>

            <div class="left">
                Abhishek's Portfolio
            </div>

            <div class="right">
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>

        </nav>
    </header>


    <main>

        <section class="firstSection">

            <div class="leftSection">

                Hi, My Name is
                <span class="Purple">Abhishek Singh</span>

                <div>
                    and I am a passionate
                    <span id="element"></span>
                </div>

            </div>


            <div class="rightSection">

                <img src="bg.png" alt="Abhishek Portfolio">

            </div>

        </section>
        <hr>
        <section class="secondSection">
            <h1>Education</h1>
        </section>
    </main>


    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
    <script>
        var typed = new Typed('#element', {
            strings: ['Programmer.', 'Web Developer.', 'AI/ML Enthusiast.', 'Problem Solver.', 'Tech Enthusiast.'],
            typeSpeed: 70,
        });
    </script>

</body>

</html>
